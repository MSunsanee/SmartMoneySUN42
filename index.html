async function act(action,data,refreshAfter=true){setBusy(true);try{const r=await api(action,data);if(refreshAfter)await loadData();showToast('บันทึกข้อมูลสำเร็จ');return r}catch(e){showToast(e.message,true);throw e}finally{setBusy(false)}}
async function loadData(){if(!state.token)return;state.data=await api('bootstrap');state.user=state.data.user;render();}
async function refresh(){if(!state.token){showLogin();return}setBusy(true);try{await loadData();showToast('อัปเดตข้อมูลล่าสุดแล้ว')}catch(e){if(/เซสชัน|เข้าสู่ระบบ|หมดอายุ/.test(e.message)) {state.token='';sessionStorage.removeItem('sm_token');state.data=null;state.user=null;render();showLogin()}showToast(e.message,true)}finally{setBusy(false)}}
async function login(ev){ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target).entries());setBusy(true);try{const r=await api('login',f,'');state.token=r.token;state.user=r.user;if(r.user.mustChangePassword){sessionStorage.setItem('sm_token',r.token);closeModal();showChangePassword(true)}else{await loadData();sessionStorage.setItem('sm_token',r.token);closeModal();showToast('ยินดีต้อนรับ '+r.user.displayName)}}catch(e){state.token='';state.user=null;state.data=null;sessionStorage.removeItem('sm_token');render();showToast(e.message+' หากยังเชื่อมไม่ได้ ให้ตรวจว่า Apps Script Deploy เป็น Web App เวอร์ชันล่าสุด',true)}finally{setBusy(false)}}
async function logout(){try{if(state.token)await api('logout',{},state.token)}catch(e){}state.token='';state.user=null;state.data=null;sessionStorage.removeItem('sm_token');render();showLogin();}
function showLogin(){const msg=!configOK()?'<div class="locknotice">⚠️ ยังไม่ได้ตั้งค่า GAS_URL กรุณาเปิดไฟล์ HTML ด้วยโปรแกรมแก้ไขข้อความ แล้ววาง URL ของ Web App ที่ส่วนบนของไฟล์ก่อนเข้าสู่ระบบ</div>':'<div class="locknotice">บัญชีเริ่มต้น: <b>admin / 1234</b> — ระบบจะให้ตั้งรหัสใหม่เมื่อเข้าสู่ระบบครั้งแรก</div>';
 showModal(`<div class="loginintro"><div class="brandmark">↗</div><span class="logopill">SECURE FINANCE WORKSPACE</span><h2>ยินดีต้อนรับสู่ Smart Money</h2><p>เข้าสู่ระบบเพื่อดูข้อมูลและจัดการการเงินของคุณ</p></div><form class="loginform" onsubmit="SM.login(event)"><label class="field">ชื่อผู้ใช้<input name="username" value="admin" autocomplete="username" required /></label><label class="field">รหัสผ่าน<input type="password" name="password" placeholder="กรอกรหัสผ่าน" autocomplete="current-password" required /></label><button class="btn primary" type="submit" style="width:100%;margin-top:5px">เข้าสู่ระบบอย่างปลอดภัย →</button></form>${msg}`,true,true)}
function showChangePassword(force=false){showModal(`<div class="logopill">SECURITY FIRST</div><h2>${force?'ตั้งรหัสผ่านใหม่ก่อนเริ่มใช้งาน':'เปลี่ยนรหัสผ่าน'}</h2><p class="muted" style="font-size:12px">เพื่อความปลอดภัย กรุณากำหนดรหัสอย่างน้อย 10 ตัว โดยมีทั้งตัวอักษรอังกฤษและตัวเลข</p><form class="loginform" onsubmit="SM.submitPassword(event)"><label class="field">รหัสผ่านปัจจุบัน<input name="oldPassword" type="password" required /></label><label class="field">รหัสผ่านใหม่<input name="newPassword" type="password" minlength="10" required /></label><label class="field">ยืนยันรหัสผ่านใหม่<input name="confirmPassword" type="password" minlength="10" required /></label><button class="btn primary" type="submit">เปลี่ยนรหัสผ่านและดำเนินการต่อ</button></form>`,true,force)}
async function submitPassword(ev){ev.preventDefault();const o=Object.fromEntries(new FormData(ev.target).entries());if(o.newPassword!==o.confirmPassword)return showToast('รหัสผ่านใหม่ไม่ตรงกัน',true);setBusy(true);try{await api('changePassword',o);closeModal();await loadData();showToast('เปลี่ยนรหัสผ่านสำเร็จ')}catch(e){showToast(e.message,true)}finally{setBusy(false)}}
function showModal(content,small=false,forced=false){id('modalRoot').innerHTML=`<div class="modalback ${forced?'loginback':''}" ${forced?'':'onclick="if(event.target===this)SM.closeModal()"'}><div class="modal ${small?'small':''}">${!forced?'<div class="right"><button class="x" type="button" onclick="SM.closeModal()">×</button></div>':''}${content}</div></div>`}
function closeModal(){id('modalRoot').innerHTML=''}
function navigate(p){if(!state.token&&!['dashboard','investing'].includes(p)){showLogin();return}if(p==='users'&&!admin())return;state.page=p;state.txEdit=null;render();window.scrollTo({top:0,behavior:'smooth'});}
function renderNav(){id('sidebar').innerHTML=`<div class="logo"><div class="brandmark">↗</div><div class="brandname">Smart Money<small>PERSONAL FINANCE</small></div></div><div class="navtitle">MAIN MENU</div><div class="nav">${menu.filter(x=>x[0]!=='users'||admin()).map(x=>`<button class="navbutton ${state.page===x[0]?'active':''}" onclick="SM.navigate('${x[0]}')"><span class="ni">${x[1]}</span>${x[2]}</button>`).join('')}</div><div class="sidefoot"><div class="connected"><span class="dot ${state.data?'on':''}"></span>${state.data?'เชื่อมต่อ Google Sheets แล้ว':'รอเชื่อมต่อ Google Sheets'}</div><div class="sideuser"><div class="avatar">${esc((state.user?.displayName||'G').slice(0,1))}</div><div style="flex:1"><b>${esc(state.user?.displayName||'ผู้เยี่ยมชม')}</b><small>${esc(state.user?.role||'กรุณาเข้าสู่ระบบ')}</small></div>${state.user?'<button class="text-btn" style="color:#cbf3d8" onclick="SM.logout()">ออก</button>':''}</div></div>`;
 id('mobilefoot').innerHTML=[['dashboard','⌂','หน้าแรก'],['transactions','⇄','รายการ'],['add','+',''],['analytics','◉','วิเคราะห์'],['investing','↗','ลงทุน'],['settings','⚙','เพิ่มเติม']].map(x=>`<button class="${state.page===x[0]?'active':''} ${x[0]==='add'?'addmid':''}" onclick="SM.navigate('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');id('connectionLabel').innerText=state.data?'● เชื่อมต่อแล้ว':!configOK()?'● ยังไม่ตั้งค่า URL':'● ยังไม่เข้าสู่ระบบ'}
function render(){renderNav();const titles={dashboard:'ภาพรวมการเงิน',transactions:'ประวัติรายการ',add:state.txEdit?'แก้ไขรายการ':'บันทึกรายรับ–รายจ่าย',analytics:'วิเคราะห์การเงิน',budgets:'แผนงบประมาณ',accounts:'บัญชีและกระเป๋าเงิน',debts:'บริหารหนี้สิน',goals:'เป้าหมายการออม',investing:'แนะนำการลงทุน',users:'จัดการผู้ใช้งาน',settings:'รายงานและการตั้งค่า'};id('pageTitle').textContent=titles[state.page]||titles.dashboard;id('pageSubtitle').textContent=state.page==='investing'?'หลักคิดพื้นฐานและแหล่งข้อมูลจากหน่วยงานทางการ':state.user?'ข้อมูลปัจจุบันจาก Google Sheets • '+esc(state.user.displayName):'Dashboard เป็นหน้าแรกเสมอ • เข้าสู่ระบบเพื่อดูข้อมูลจริง';let page=state.page;if(!state.data&&!['dashboard','investing'].includes(page))page='dashboard';id('content').innerHTML=({dashboard:dashboard,transactions:transactions,add:addForm,analytics:analytics,budgets:budgets,accounts:accounts,debts:debts,goals:goals,investing:investing,users:users,settings:settings}[page]||dashboard)();if(!state.data&&page!=='investing')id('content').classList.add('locksurface');else id('content').classList.remove('locksurface')}
function confirmed(){return arr('transactions').filter(active)}
function monthTx(){return confirmed().filter(t=>String(t.date).slice(0,7)===state.month)}
function txValue(type,txs=monthTx()){return txs.filter(t=>t.type===type).reduce((s,t)=>s+n(t.amount),0)}
function balances(){const map={};arr('accounts').forEach(a=>map[a.id]=n(a.openingBalance));confirmed().forEach(t=>{if(!(t.accountId in map))return; if(t.type==='income')map[t.accountId]+=n(t.amount);if(t.type==='expense'||t.type==='debt_payment')map[t.accountId]-=n(t.amount);if(t.type==='transfer'){map[t.accountId]-=n(t.amount);if(t.toAccountId in map)map[t.toAccountId]+=n(t.amount)}});return map}
function expenseByCategory(txs=monthTx()){const m={};txs.filter(t=>t.type==='expense').forEach(t=>m[t.categoryId]=(m[t.categoryId]||0)+n(t.amount));return Object.entries(m).map(([id,value])=>({...cat(id),id,value})).sort((a,b)=>b.value-a.value)}
function colorFor(t){return t.type==='income'?'plus':t.type==='expense'?'minus':'gray'}
function catName(t){if(t.type==='transfer')return'โอนระหว่างบัญชี';if(t.type==='debt_payment')return'ชำระหนี้';return cat(t.categoryId)?.name||'ไม่ระบุหมวด'}
function actionbuttons(t){return `<div class="flex nowrap">${t.receiptId?`<button class="btn sm ghost" onclick="SM.viewReceipt('${esc(t.receiptId)}')">🧾 สลิป</button>`:''}${isEdit()&&t.type!=='debt_payment'?`<button class="btn sm ghost" onclick="SM.editTx('${esc(t.id)}')">แก้ไข</button><button class="btn sm danger" onclick="SM.cancelTx('${esc(t.id)}')">ยกเลิก</button>`:''}</div>`}
function txTable(list,full=false){if(!list.length)return`<div class="empty"><div class="emoji">🌱</div><b>ยังไม่มีรายการ</b>เริ่มต้นบันทึกรายรับหรือรายจ่ายรายการแรกได้เลย</div>`;return`<div class="tablewrap"><table class="tbl"><thead><tr><th>วันที่</th><th>รายการ / หมวดหมู่</th><th>บัญชี</th><th>ประเภท</th><th class="right">จำนวนเงิน</th>${full?'<th>จัดการ</th>':'<th>สลิป</th>'}</tr></thead><tbody>${list.map(t=>`<tr><td class="nowrap">${dt(t.date)}</td><td><div class="namecell"><div class="articon">${t.type==='income'?'↙':t.type==='expense'?'↗':'⇄'}</div><div><b>${esc(t.description||t.merchant||catName(t))}</b><div class="smallhint">${esc(catName(t))}${t.merchant?' • '+esc(t.merchant):''}</div></div></div></td><td>${esc(acct(t.accountId)?.name||'-')}</td><td><span class="tag ${t.type==='expense'?'red':t.type==='income'?'':'gray'}">${({income:'รายรับ',expense:'รายจ่าย',transfer:'โอนเงิน',debt_payment:'ชำระหนี้'})[t.type]||'-'}</span></td><td class="right"><span class="amount ${colorFor(t)}">${t.type==='income'?'+':t.type==='expense'||t.type==='debt_payment'?'-':''}฿${money(t.amount)}</span></td><td>${full?actionbuttons(t):t.receiptId?`<button class="btn sm ghost" onclick="SM.viewReceipt('${esc(t.receiptId)}')">ดูสลิป</button>`:'<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table></div>`}
function monthlyTrend(){let a=[];let d=new Date(state.month+'-01T12:00:00');for(let i=5;i>=0;i--){let x=new Date(d.getFullYear(),d.getMonth()-i,1);let mon=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');let ts=confirmed().filter(t=>t.date?.slice(0,7)===mon);a.push({name:x.toLocaleDateString('th-TH',{month:'short'}),income:txValue('income',ts),expense:txValue('expense',ts)})}return a}
function trendChart(){const a=monthlyTrend(),max=Math.max(...a.map(x=>Math.max(x.income,x.expense)),1),w=600,h=200,x=i=>45+i*102,y=v=>155-v/max*128;let g=[0,.25,.5,.75,1].map(f=>`<line x1="40" y1="${y(f*max)}" x2="592" y2="${y(f*max)}" stroke="#e9f1eb" stroke-dasharray="4 5"/><text x="1" y="${y(f*max)+4}" font-size="10" fill="#91a397">${moneyShort(f*max)}</text>`).join('');let paths=['income','expense'].map((key,j)=>{const stroke=j?'#f7a4ac':'#0cac65',points=a.map((o,i)=>x(i)+','+y(o[key])).join(' ');return`<polyline points="${points}" fill="none" stroke="${stroke}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${a.map((o,i)=>`<circle cx="${x(i)}" cy="${y(o[key])}" r="4" fill="white" stroke="${stroke}" stroke-width="3"/>`).join('')}`}).join('');return`<div class="chart"><svg viewBox="0 0 ${w} ${h}" aria-label="กราฟรายรับรายจ่าย 6 เดือน">${g}${paths}${a.map((o,i)=>`<text x="${x(i)}" y="187" text-anchor="middle" font-size="11" fill="#91a398">${o.name}</text>`).join('')}</svg></div><div class="flex" style="justify-content:center;font-size:11px;color:#799082"><span class="swatch" style="background:#0cac65"></span>รายรับ <span class="swatch" style="background:#f7a4ac;margin-left:14px"></span>รายจ่าย</div>`}
function donutChart(){let x=expenseByCategory().slice(0,5),total=txValue('expense');if(!total)return `<div class="empty"><div class="emoji">◉</div>ยังไม่มีข้อมูลรายจ่ายในเดือนนี้</div>`;const used=x.reduce((s,a)=>s+a.value,0);if(total>used)x.push({name:'หมวดอื่น ๆ',value:total-used,color:'#dce9df'});let start=0,parts=x.map(a=>{let end=start+a.value/total*100;const s=`${a.color||'#12a46c'} ${start}% ${end}%`;start=end;return s}).join(',');return`<div class="donutrow"><div class="donut" style="background:conic-gradient(${parts})"><div class="donutinner"><small>รายจ่ายรวม</small><strong>฿${moneyShort(total)}</strong><small>เดือนนี้</small></div></div><div class="legend">${x.map(a=>`<div class="legendrow"><span class="name"><span class="swatch" style="background:${esc(a.color||'#12a46c')}"></span>${esc(a.name||'อื่น ๆ')}</span><strong>${(a.value/total*100).toFixed(1)}%</strong></div>`).join('')}</div></div>`}
function dashboard(){const t=state.data?monthTx():[],inc=txValue('income',t),exp=txValue('expense',t),debt=txValue('debt_payment',t),net=inc-exp-debt,b=balances(),balance=Object.values(b).reduce((s,x)=>s+x,0),day=today(),dT=confirmed().filter(x=>x.date===day),todayIn=txValue('income',dT),todayOut=txValue('expense',dT)+txValue('debt_payment',dT);return`<section class="hero"><div><span class="hero-kicker">✦ YOUR FINANCIAL OVERVIEW</span><h2>จัดการเงินให้ชัดเจน ทุกบาทมีความหมาย</h2><p>รู้รายรับ เห็นรายจ่าย วางแผนอนาคตได้ในหน้าจอเดียว</p></div><div class="hero-side"><span>ยอดเงินคงเหลือทุกบัญชี</span><div class="hero-stat">฿${state.data?money(balance):'—'}</div><button class="btn" onclick="SM.navigate('add')">＋ เพิ่มรายการใหม่</button></div></section><div class="grid kpis">${kpi('↙','รายรับเดือนนี้',inc,'รับทั้งหมดในเดือนที่เลือก')}${kpi('↗','รายจ่ายเดือนนี้',exp,'ไม่รวมการโอนเงิน','red')}${kpi('◉','เงินสุทธิเดือนนี้',net,'หลังหักรายจ่ายและชำระหนี้','blue')}${kpi('◇','วันนี้รับ / จ่าย',todayIn,'จ่าย ฿'+money(todayOut),'gold')}</div><div class="grid double"><section class="card"><div class="cardhead"><div><h3>ภาพรวมรายรับ–รายจ่าย</h3><small>แนวโน้ม 6 เดือนย้อนหลัง</small></div><span class="tag">อัปเดตตามข้อมูลจริง</span></div>${trendChart()}</section><section class="card"><div class="cardhead"><div><h3>รายจ่ายแยกตามหมวด</h3><small>สัดส่วนของเดือนที่เลือก</small></div><input aria-label="เลือกเดือน" type="month" value="${state.month}" onchange="SM.setMonth(this.value)" style="width:154px;padding:8px" /></div>${donutChart()}</section></div><div class="sectionhead"><h3>รายการล่าสุด</h3><button class="btn sm ghost" onclick="SM.navigate('transactions')">ดูรายการทั้งหมด →</button></div><div class="card">${txTable(confirmed().slice().sort((a,b)=>String(b.date+b.createdAt).localeCompare(String(a.date+a.createdAt))).slice(0,7))}</div><div class="footnote">SMART MONEY • PRIVACY FIRST • GOOGLE SHEETS BACKEND</div>`}
function kpi(icon,label,value,hint,cls='',unit='฿'){return`<article class="card kpi ${cls}"><div class="symbol">${icon}</div><div class="label">${label}</div><div class="number">${state.data?(unit==='%'?money(value)+'%':unit+money(value)):'—'}</div><div class="hint">${hint}</div></article>`}
function setMonth(v){if(/^\d{4}-\d{2}$/.test(v)){state.month=v;render()}}
function transactions(){const records=confirmed().filter(t=>(!state.month||t.date?.slice(0,7)===state.month)&&(state.filterType==='all'||t.type===state.filterType)&&(!state.search||JSON.stringify(t).toLowerCase().includes(state.search.toLowerCase())||catName(t).includes(state.search)||acct(t.accountId)?.name.includes(state.search))).slice().sort((a,b)=>String(b.date+b.createdAt).localeCompare(String(a.date+a.createdAt)));
return`<div class="sectionhead"><h3>ประวัติการเคลื่อนไหว</h3><button class="btn primary" onclick="SM.navigate('add')">＋ รายการใหม่</button></div><div class="card"><div class="filters"><input type="month" value="${state.month}" onchange="SM.setMonth(this.value)"/><select onchange="SM.setFilterType(this.value)"><option value="all">ทุกประเภท</option><option value="income" ${state.filterType==='income'?'selected':''}>รายรับ</option><option value="expense" ${state.filterType==='expense'?'selected':''}>รายจ่าย</option><option value="transfer" ${state.filterType==='transfer'?'selected':''}>โอนเงิน</option><option value="debt_payment" ${state.filterType==='debt_payment'?'selected':''}>ชำระหนี้</option></select><input style="flex:1;min-width:210px" placeholder="ค้นหาชื่อร้านค้า หมวดหมู่ หมายเหตุ..." value="${esc(state.search)}" oninput="SM.setSearch(this.value)"/><button class="btn sm ghost" onclick="SM.exportCSV()">⇩ Export CSV</button></div><div class="rowbetween" style="margin-bottom:12px"><span class="muted">พบ ${records.length} รายการ</span><strong>รายรับ ฿${money(txValue('income',records))} • รายจ่าย ฿${money(txValue('expense',records))}</strong></div>${txTable(records,true)}</div>`}
function setFilterType(s){state.filterType=s;render()}function setSearch(s){state.search=s;render();const input=document.querySelector('.filters input[placeholder]');if(input){input.focus();input.setSelectionRange(s.length,s.length)}}
function optAccounts(selected=''){return arr('accounts').filter(x=>x.active===true||String(x.active)==='true'||x.id===selected).map(a=>`<option value="${esc(a.id)}" ${a.id===selected?'selected':''}>${esc(a.name)}</option>`).join('')}
function optCats(type,selected=''){return arr('categories').filter(x=>x.type===type&&(x.active===true||String(x.active)==='true'||x.id===selected)).map(a=>`<option value="${esc(a.id)}" ${a.id===selected?'selected':''}>${esc(a.name)}</option>`).join('')}
function addForm(){const t=state.txEdit&&arr('transactions').find(x=>x.id===state.txEdit),type=t?.type||'expense';return`<div class="grid double"><div class="card"><div class="cardhead"><div><h3>${t?'แก้ไขข้อมูลรายการ':'บันทึกรายการใหม่'}</h3><small>กรอกข้อมูลให้ครบแล้วกดบันทึก • ช่อง <span class="required">*</span> จำเป็น</small></div><span class="tag">${t?'EDIT':'NEW ENTRY'}</span></div><form id="txForm" onsubmit="SM.saveTx(event)"><input type="hidden" name="id" value="${esc(t?.id||'')}"/><div class="seg" style="margin-bottom:20px">${[['income','↙ รายรับ'],['expense','↗ รายจ่าย'],['transfer','⇄ โอนเงิน']].map(x=>`<button type="button" class="${type===x[0]?'active':''}" onclick="SM.changeTxType('${x[0]}')">${x[1]}</button>`).join('')}</div><input type="hidden" id="txType" name="type" value="${type}"/><div class="formgrid"><label class="field">จำนวนเงิน <span class="required">*</span><input type="number" step="0.01" min="0.01" name="amount" placeholder="0.00" value="${esc(t?.amount||'')}" required /></label><label class="field">วันที่ทำรายการ <span class="required">*</span><input type="date" name="date" value="${esc(t?.date||today())}" required/></label><label class="field">บัญชีต้นทาง <span class="required">*</span><select name="accountId" required><option value="">เลือกบัญชี</option>${optAccounts(t?.accountId)}</select></label><label class="field" id="destWrap" style="display:${type==='transfer'?'flex':'none'}">บัญชีปลายทาง <span class="required">*</span><select name="toAccountId"><option value="">เลือกบัญชี</option>${optAccounts(t?.toAccountId)}</select></label><label class="field" id="catWrap" style="display:${type==='transfer'?'none':'flex'}">หมวดหมู่ <span class="required">*</span><select name="categoryId" id="catSelect"><option value="">เลือกหมวดหมู่</option>${optCats(type,t?.categoryId)}</select></label><label class="field">ช่องทางชำระเงิน<select name="paymentMethod">${['โอนธนาคาร','เงินสด','พร้อมเพย์','บัตรเดบิต','บัตรเครดิต','อื่น ๆ'].map(x=>`<option ${t?.paymentMethod===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">ผู้รับ / ผู้จ่ายเงิน<input name="merchant" maxlength="120" value="${esc(t?.merchant||'')}" placeholder="เช่น ร้านค้า / ชื่อผู้โอน"/></label><label class="field">เลขอ้างอิงธุรกรรม<input name="reference" maxlength="100" value="${esc(t?.reference||'')}" placeholder="ระบุเมื่อมีสลิป" /></label><label class="field wide">รายละเอียดเพิ่มเติม<textarea name="description" rows="3" placeholder="อธิบายรายการเพื่อค้นหาย้อนหลังได้ง่าย">${esc(t?.description||'')}</textarea></label></div><div class="formactions"><button type="button" class="btn ghost" onclick="SM.navigate('transactions')">ยกเลิก</button><button class="btn primary" type="submit" ${isEdit()?'':'disabled'}>✓ บันทึกรายการ${state.receipt?'พร้อมสลิป':''}</button></div></form></div><div><div class="card"><div class="cardhead"><div><h3>📸 แนบภาพสลิป / ใบเสร็จ</h3><small>ถ่ายภาพจากกล้องหรือเลือกรูปเดิม</small></div></div><div class="uploader"><div class="upicon">▧</div><strong>สลิปของคุณปลอดภัยและตรวจสอบย้อนหลังได้</strong><small>รองรับ JPG, PNG, WebP • บีบอัดก่อนส่ง</small><br/><label for="receiptPicker">🖼 เลือกรูปจากเครื่อง</label><input id="receiptPicker" type="file" accept="image/*" onchange="SM.chooseReceipt(event)"/><label for="receiptCamera" style="margin-left:7px">📷 ถ่ายภาพสลิป</label><input id="receiptCamera" type="file" accept="image/*" capture="environment" onchange="SM.chooseReceipt(event)"/><div id="receiptPreview">${t?.receiptId?'<small>รายการนี้มีสลิปเดิมแนบไว้แล้ว หากแนบใหม่จะเป็นรูปหลักฐานล่าสุด</small>':''}</div></div><div class="notice">ภาพจะบันทึกลง Google Drive แบบส่วนตัวและผูกกับรายการนี้ สามารถเปิดดูย้อนหลังได้จากประวัติรายการ</div><button class="btn ghost" id="ocrButton" ${state.receipt?'':'disabled'} onclick="SM.scanSlip()">✦ ลองอ่านข้อมูลจากสลิป (OCR)</button><div id="ocrOutput" class="smallhint" style="margin-top:12px">ฟังก์ชัน OCR ต้องตั้งค่า Google Cloud Vision API Key เพิ่มเติมใน GAS; หากยังไม่เปิดใช้ สามารถกรอกข้อมูลเองได้ตามปกติ</div></div><div class="card" style="margin-top:17px;background:linear-gradient(130deg,#0f8054,#0aaf68);color:#fff"><b>💡 เคล็ดลับบันทึกไว</b><p style="line-height:1.8;font-size:12px;color:#e2fff0">ถ่ายสลิปทันทีที่จ่ายเงิน เลือกหมวดหมู่ แล้วกดบันทึก ระบบจะนำยอดไปคำนวณ Dashboard และรายงานให้โดยอัตโนมัติ</p></div></div></div>`}
function changeTxType(type){id('txType').value=type;document.querySelectorAll('.seg button').forEach((b,i)=>b.classList.toggle('active',['income','expense','transfer'][i]===type));id('catWrap').style.display=type==='transfer'?'none':'flex';id('destWrap').style.display=type==='transfer'?'flex':'none';id('catSelect').innerHTML='<option value="">เลือกหมวดหมู่</option>'+optCats(type)}
async function chooseReceipt(ev){const file=ev.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/'))return showToast('กรุณาเลือกรูปภาพเท่านั้น',true);if(file.size>18000000)return showToast('ภาพต้นฉบับใหญ่เกิน 18 MB',true);try{const base64=await compressImage(file);state.receipt={base64,fileName:file.name.replace(/\.[^.]+$/,'.jpg'),mimeType:'image/jpeg'};id('receiptPreview').innerHTML=`<img class="preview" alt="ตัวอย่างสลิป" src="data:image/jpeg;base64,${base64}" /><small>แนบรูปสำเร็จ พร้อมบันทึก</small>`;id('ocrButton').disabled=false;showToast('เตรียมรูปสลิปเรียบร้อย')}catch(e){showToast(e.message,true)}}
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('อ่านรูปไม่สำเร็จ'));reader.onload=()=>{const image=new Image();image.onerror=()=>reject(new Error('ไม่สามารถเปิดรูปได้'));image.onload=()=>{const scale=Math.min(1,1500/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);const b64=canvas.toDataURL('image/jpeg',.77).split(',')[1];if(b64.length>2700000)return reject(new Error('ภาพหลังบีบอัดใหญ่เกิน กรุณาเลือกรูปที่เล็กลง'));resolve(b64)};image.src=reader.result};reader.readAsDataURL(file)})}
async function scanSlip(){if(!state.receipt)return;setBusy(true);try{const r=await api('scanSlip',state.receipt);id('ocrOutput').innerHTML=`<div class="notice warn">⚠️ ข้อความ OCR ต้องตรวจสอบกับภาพจริงเสมอ</div><pre style="white-space:pre-wrap;max-height:180px;overflow:auto">${esc(r.rawText||'ไม่พบข้อความ')}</pre>`;if(r.amountCandidate&&confirm('OCR พบยอดที่อาจใช่: ฿'+money(r.amountCandidate)+'\nต้องการนำไปใส่ช่องจำนวนเงินหรือไม่?'))id('txForm').elements.amount.value=r.amountCandidate}catch(e){showToast(e.message,true)}finally{setBusy(false)}}
async function saveTx(ev){ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target).entries());if(!isEdit())return showToast('ไม่มีสิทธิ์บันทึก',true);setBusy(true);try{const result=await api('saveTransaction',d);if(state.receipt){try{await api('uploadReceipt',{transactionId:result.id,...state.receipt})}catch(e){showToast('บันทึกรายการสำเร็จ แต่แนบรูปไม่สำเร็จ: '+e.message,true)}}state.receipt=null;state.txEdit=null;await loadData();state.page='transactions';render();showToast('บันทึกยอด ฿'+money(d.amount)+' สำเร็จ')}catch(e){showToast(e.message,true)}finally{setBusy(false)}}
function editTx(txId){state.receipt=null;state.txEdit=txId;state.page='add';render();window.scrollTo(0,0)}
async function cancelTx(txId){if(!confirm('ยืนยันยกเลิกรายการนี้? ระบบจะเก็บประวัติการยกเลิกไว้'))return;await act('cancelTransaction',{id:txId})}
async function viewReceipt(receiptId){setBusy(true);try{const r=await api('getReceipt',{receiptId});showModal(`<div class="modalhead"><h2>หลักฐานการทำธุรกรรม</h2></div><img style="max-width:100%;display:block;margin:auto" src="data:${esc(r.mimeType)};base64,${r.base64}" alt="สลิป"/><p class="smallhint">${esc(r.fileName)} • เก็บเป็นส่วนตัวใน Google Drive</p>`)}catch(e){showToast(e.message,true)}finally{setBusy(false)}}
function analytics(){const ts=monthTx(),inc=txValue('income',ts),out=txValue('expense',ts),debtpay=txValue('debt_payment',ts),net=inc-out-debtpay,top=expenseByCategory(ts),before=new Date(state.month+'-01T12:00:00');before.setMonth(before.getMonth()-1);const prev=before.getFullYear()+'-'+String(before.getMonth()+1).padStart(2,'0'),prevTx=confirmed().filter(t=>t.date?.slice(0,7)===prev),prevExpense=txValue('expense',prevTx),diff=prevExpense?(out-prevExpense)/prevExpense*100:null,rate=inc>0?(inc-out-debtpay)/inc*100:null;return`<div class="sectionhead"><h3>Financial Intelligence</h3><input type="month" value="${state.month}" onchange="SM.setMonth(this.value)" style="width:170px"/></div><div class="grid kpis">${kpi('▤','รายรับทั้งหมด',inc,'ประจำเดือน')}${kpi('◌','รายจ่ายบริโภค',out,'ไม่รวมการชำระหนี้','red')}${kpi('◇','เงินสุทธิหลังชำระหนี้',net,'รายรับ - รายจ่าย - ชำระหนี้','blue')}${kpi('↑','อัตราเงินสุทธิ',rate||0,rate===null?'ยังไม่มีรายรับ':rate.toFixed(1)+'% ของรายรับ','gold','%')}</div><div class="grid double"><div class="card"><div class="cardhead"><div><h3>แนวโน้ม 6 เดือน</h3><small>เปรียบเทียบการเปลี่ยนแปลงรายรับรายจ่าย</small></div></div>${trendChart()}</div><div class="card"><div class="cardhead"><h3>หมวดรายจ่ายที่สูงที่สุด</h3></div>${top.length?top.slice(0,6).map(a=>`<div class="budgetrow"><div class="rowbetween"><b>${esc(a.name)}</b><strong>฿${money(a.value)}</strong></div><div class="progress"><div style="width:${out?a.value/out*100:0}%;background:${esc(a.color||'#0eaa68')}"></div></div></div>`).join(''):'<div class="empty">ยังไม่มีข้อมูล</div>'}</div></div><div class="sectionhead"><h3>ข้อสังเกตจากข้อมูลจริง</h3></div><div class="analysisgrid">${insight('💡 ภาพรวม',inc?`เดือนนี้รับ ฿${money(inc)} จ่าย ฿${money(out)} และชำระหนี้ ฿${money(debtpay)} จึงเหลือเงินสุทธิ ฿${money(net)}.`:'ยังไม่มีรายรับในเดือนที่เลือก')}${insight('📈 เปรียบเทียบเดือนก่อน',diff===null?'ยังไม่มีข้อมูลรายจ่ายเดือนก่อนสำหรับเปรียบเทียบ':`รายจ่ายบริโภค${diff>=0?'เพิ่มขึ้น':'ลดลง'} ${Math.abs(diff).toFixed(1)}% เมื่อเทียบกับเดือนก่อน`)}${insight('🎯 จุดที่ควรตรวจสอบ',top.length?`หมวด “${esc(top[0].name)}” มีค่าใช้จ่ายสูงสุด ฿${money(top[0].value)} คิดเป็น ${(top[0].value/out*100).toFixed(1)}% ของรายจ่ายเดือนนี้`:'เริ่มบันทึกรายจ่ายเพื่อดูว่าหมวดใดใช้เงินมากที่สุด')}${insight('🌱 การออม',rate===null?'เมื่อมีรายรับแล้วระบบจะคำนวณสัดส่วนเงินสุทธิให้':rate>=20?`เดือนนี้มีอัตราเงินสุทธิ ${rate.toFixed(1)}% ของรายรับ ซึ่งช่วยให้วางแผนกันเงินออมได้`:`อัตราเงินสุทธิอยู่ที่ ${rate.toFixed(1)}% ของรายรับ ลองทบทวนค่าใช้จ่ายที่ปรับลดได้`)}</div><div class="notice">การวิเคราะห์นี้คำนวณจากรายการที่บันทึกจริง ไม่ใช่คำแนะนำการลงทุนเฉพาะบุคคล และไม่ได้ส่งข้อมูลไปยัง AI ภายนอก</div>`}
function insight(title,body){return `<div class="insight"><b>${title}</b><div style="margin-top:7px">${body}</div></div>`}
function budgets(){const bs=arr('budgets').filter(x=>x.month===state.month),used=expenseByCategory(monthTx()),total=bs.reduce((s,b)=>s+n(b.limitAmount),0),consumed=bs.reduce((s,b)=>s+(used.find(u=>u.id===b.categoryId)?.value||0),0);return`<div class="sectionhead"><h3>งบประมาณรายเดือน</h3><div class="flex"><input type="month" value="${state.month}" onchange="SM.setMonth(this.value)" style="width:155px"/><button class="btn primary" ${isEdit()?'':'disabled'} onclick="SM.openEditor('budget')">＋ ตั้งงบประมาณ</button></div></div><div class="grid kpis">${kpi('▤','งบประมาณที่ตั้ง',total,'ทุกหมวดรวมกัน')}${kpi('↗','ใช้จ่ายไปแล้ว',consumed,'เฉพาะหมวดที่ตั้งงบ','red')}${kpi('◇','งบคงเหลือ',total-consumed,'อาจติดลบเมื่อเกินงบ','blue')}${kpi('◉','ใช้ไปแล้ว',total?consumed/total*100:0,total?(consumed/total*100).toFixed(1)+'% ของงบทั้งหมด':'ยังไม่ได้ตั้งงบ','gold','%')}</div><div class="card"><div class="cardhead"><h3>งบตามหมวดหมู่</h3></div>${bs.length?bs.map(b=>{let spent=used.find(u=>u.id===b.categoryId)?.value||0,pct=spent/n(b.limitAmount)*100;return`<div class="budgetrow"><div class="rowbetween"><div><b>${esc(cat(b.categoryId)?.name||'ไม่พบหมวด')}</b><div class="smallhint">ใช้แล้ว ฿${money(spent)} จาก ฿${money(b.limitAmount)}</div></div><div class="flex"><span class="tag ${pct>100?'red':''}">${pct.toFixed(1)}%</span><button class="btn sm ghost" onclick="SM.openEditor('budget','${esc(b.id)}')">แก้ไข</button></div></div><div class="progress"><div style="width:${Math.min(pct,100)}%;background:${pct>100?'#e75d71':pct>=80?'#eab308':'#0eb86e'}"></div></div>${pct>=100?'<small class="minus">⚠️ ใช้งบเกินกำหนดแล้ว</small>':pct>=80?'<small style="color:#b38409">⚠️ ใช้เกิน 80% ของงบ</small>':''}</div>`}).join(''):'<div class="empty"><div class="emoji">▥</div>ยังไม่มีงบประมาณ กด “ตั้งงบประมาณ” เพื่อเริ่มต้น</div>'}</div>`}
function accounts(){const bs=balances();return`<div class="sectionhead"><h3>บัญชีและกระเป๋าเงิน</h3><button class="btn primary" ${isEdit()?'':'disabled'} onclick="SM.openEditor('account')">＋ เพิ่มบัญชี</button></div><div class="grid kpis">${kpi('▣','ยอดทุกบัญชีรวม',Object.values(bs).reduce((s,x)=>s+x,0),'ยอดยกมา + ธุรกรรมจริง')}${kpi('↙','รับทั้งหมด',txValue('income',confirmed()),'สะสมจากทุกช่วงเวลา')}${kpi('↗','จ่ายทั้งหมด',txValue('expense',confirmed()),'ไม่รวมโอนและชำระหนี้','red')}${kpi('⇄','จำนวนการโอน',confirmed().filter(t=>t.type==='transfer').length,'ครั้ง','blue','')}</div><div class="grid twocol">${arr('accounts').map(a=>`<div class="card"><div class="rowbetween"><div class="namecell"><div class="articon">${a.type==='cash'?'💵':a.type==='credit'?'▣':a.type==='savings'?'🌱':'🏦'}</div><div><b>${esc(a.name)}</b><div class="smallhint">${esc(({cash:'เงินสด',bank:'ธนาคาร',savings:'เงินออม',credit:'บัตรเครดิต',other:'อื่น ๆ'})[a.type]||a.type)}</div></div></div><button class="btn sm ghost" ${isEdit()?'':'disabled'} onclick="SM.openEditor('account','${esc(a.id)}')">แก้ไข</button></div><div style="font-size:27px;font-weight:900;margin:17px 0 4px;color:#088c55">฿${money(bs[a.id])}</div><small class="muted">ยอดยกมา ฿${money(a.openingBalance)} ${String(a.active)==='false'?'• ปิดใช้งาน':''}</small></div>`).join('')}</div><div class="sectionhead"><h3>จัดการหมวดหมู่</h3><button class="btn sm ghost" ${isEdit()?'':'disabled'} onclick="SM.openEditor('category')">＋ เพิ่มหมวดหมู่</button></div><div class="card"><div class="flex">${arr('categories').map(c=>`<button class="chip" onclick="SM.openEditor('category','${esc(c.id)}')"><span class="swatch" style="display:inline-block;background:${esc(c.color||'#0ca35f')}"></span>${esc(c.name)} ${c.type==='income'?'↙':'↗'}</button>`).join('')}</div></div>`}
function debts(){const ts=confirmed().filter(t=>t.type==='debt_payment');const bal=d=>Math.max(0,n(d.principal)-ts.filter(t=>t.debtId===d.id).reduce((s,x)=>s+n(x.principalComponent),0));return`<div class="sectionhead"><h3>ติดตามภาระหนี้สิน</h3><button class="btn primary" ${isEdit()?'':'disabled'} onclick="SM.openEditor('debt')">＋ เพิ่มหนี้</button></div><div class="grid kpis">${kpi('▣','เงินต้นคงเหลือ',arr('debts').reduce((s,d)=>s+bal(d),0),'หักยอดเงินต้นที่ชำระแล้ว')}${kpi('↗','ชำระเงินต้นสะสม',ts.reduce((s,t)=>s+n(t.principalComponent),0),'ยอดที่บันทึกแล้ว')}${kpi('◉','ดอกเบี้ยจ่ายสะสม',ts.reduce((s,t)=>s+n(t.interestComponent),0),'แยกจากเงินต้น','red')}${kpi('◇','แผนผ่อนต่อเดือน',arr('debts').reduce((s,d)=>s+n(d.monthlyPayment),0),'ผลรวมรายการหนี้','gold')}</div><div class="grid twocol">${arr('debts').map(d=>`<div class="card"><div class="rowbetween"><div><h3 style="margin:0">${esc(d.name)}</h3><small class="muted">ดอกเบี้ย ${money(d.interestRate)}% ต่อปี • ครบกำหนดวันที่ ${esc(d.dueDay)}</small></div><button class="btn sm ghost" onclick="SM.openEditor('debt','${esc(d.id)}')">แก้ไข</button></div><div style="font-size:29px;font-weight:900;margin:18px 0 6px">฿${money(bal(d))}</div><div class="smallhint">จากเงินต้น ฿${money(d.principal)}</div><div class="progress"><div style="width:${Math.max(0,Math.min(100,100*(1-bal(d)/n(d.principal))))}%"></div></div><div class="rowbetween"><span class="muted">ผ่อนเป้าหมาย ฿${money(d.monthlyPayment)}/เดือน</span><button class="btn sm primary" ${isEdit()?'':'disabled'} onclick="SM.openDebtPayment('${esc(d.id)}')">＋ บันทึกชำระหนี้</button></div></div>`).join('')||'<div class="card empty">ยังไม่มีรายการหนี้</div>'}</div><div class="sectionhead"><h3>ประวัติชำระหนี้</h3></div><div class="card">${txTable(ts.slice().sort((a,b)=>b.date.localeCompare(a.date)))}</div>`}
function goals(){return`<div class="sectionhead"><h3>เป้าหมายการออม</h3><button class="btn primary" ${isEdit()?'':'disabled'} onclick="SM.openEditor('goal')">＋ เพิ่มเป้าหมาย</button></div><div class="grid twocol">${arr('goals').map(g=>{let pct=n(g.targetAmount)?n(g.currentAmount)/n(g.targetAmount)*100:0;return`<div class="card"><div class="rowbetween"><div><span class="tag">SAVINGS GOAL</span><h3>${esc(g.name)}</h3></div><button class="btn sm ghost" onclick="SM.openEditor('goal','${esc(g.id)}')">แก้ไข</button></div><div class="rowbetween" style="margin:15px 0"><strong style="font-size:27px;color:#0d9e61">฿${money(g.currentAmount)}</strong><span class="muted">/ ฿${money(g.targetAmount)}</span></div><div class="progress"><div style="width:${Math.min(pct,100)}%"></div></div><div class="rowbetween"><small class="muted">สำเร็จ ${pct.toFixed(1)}%</small><small class="muted">เป้าหมาย ${dt(g.targetDate)}</small></div></div>`}).join('')||'<div class="card empty">สร้างเป้าหมายเงินสำรองฉุกเฉิน หรือเป้าหมายอื่น ๆ ได้ที่นี่</div>'}</div><div class="notice">ยอดสะสมเป้าหมายเป็นตัวติดตามแผน ไม่ได้หักเงินจากบัญชีอัตโนมัติ หากต้องการย้ายเงินจริง ให้บันทึก “โอนเงิน” ไปบัญชีออมทรัพย์</div>`}
function users(){if(!admin())return'<div class="notice warn">สำหรับผู้ดูแลระบบเท่านั้น</div>';return`<div class="sectionhead"><h3>รายชื่อผู้ใช้งานและสิทธิ์เข้าถึง</h3><button class="btn primary" onclick="SM.openEditor('user')">＋ เพิ่มผู้ใช้</button></div><div class="card">${(arr('users').length?`<div class="tablewrap"><table class="tbl"><thead><tr><th>ผู้ใช้งาน</th><th>ชื่อเข้าระบบ</th><th>สิทธิ์</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>${arr('users').map(u=>`<tr><td><b>${esc(u.displayName)}</b></td><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td><span class="tag ${u.active?'':'red'}">${u.active?'ใช้งาน':'ปิดใช้งาน'}</span></td><td>${u.id!==state.user.id?`<button class="btn sm ${u.active?'danger':'primary'}" onclick="SM.toggleUser('${esc(u.id)}',${u.active?'false':'true'})">${u.active?'ปิดใช้งาน':'เปิดใช้งาน'}</button>`:'บัญชีปัจจุบัน'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">ไม่มีผู้ใช้งาน</div>')}</div><div class="sectionhead"><h3>ประวัติกิจกรรมล่าสุด</h3></div><div class="card tablewrap"><table class="tbl"><thead><tr><th>วันที่/เวลา</th><th>ผู้ใช้</th><th>กิจกรรม</th><th>ตารางข้อมูล</th></tr></thead><tbody>${arr('auditLogs').slice(0,30).map(l=>`<tr><td>${esc(l.at)}</td><td>${esc(arr('users').find(u=>u.id===l.userId)?.displayName||l.userId)}</td><td>${esc(l.action)}</td><td>${esc(l.entity)}</td></tr>`).join('')}</tbody></table></div>`}
async function toggleUser(u,a){if(!confirm(a?'เปิดใช้งานผู้ใช้นี้?':'ปิดใช้งานผู้ใช้นี้?'))return;await act('setUserActive',{id:u,active:a})}
function settings(){return`<div class="grid double"><section class="card"><div class="cardhead"><h3>รายงานและการส่งออกข้อมูล</h3></div><div class="formgrid"><label class="field">ตั้งแต่วันที่<input type="date" id="fromDate" value="${esc(state.fromDate||state.month+'-01')}" onchange="SM.setReportDate('fromDate',this.value)"/></label><label class="field">ถึงวันที่<input type="date" id="toDate" value="${esc(state.toDate||today())}" onchange="SM.setReportDate('toDate',this.value)"/></label></div><div class="flex" style="margin-top:20px"><button class="btn primary" onclick="SM.exportCSV(true)">⇩ ส่งออก CSV เปิดด้วย Excel</button><button class="btn ghost" onclick="SM.printReport()">🖨 พิมพ์ / บันทึกเป็น PDF</button></div><div class="notice">CSV ใช้เปิดใน Microsoft Excel ได้ (เข้ารหัส UTF-8 พร้อม BOM) ส่วน PDF ใช้คำสั่งพิมพ์ของเบราว์เซอร์ → บันทึกเป็น PDF</div></section><section class="card"><div class="cardhead"><h3>สถานะและความปลอดภัย</h3></div><div class="budgetrow"><div class="rowbetween"><span>สถานะ Google Sheets</span><span class="tag">${state.data?'เชื่อมต่อแล้ว':'ยังไม่เชื่อมต่อ'}</span></div></div><div class="budgetrow"><div class="rowbetween"><span>ชื่อบัญชี</span><b>${esc(state.user?.username||'-')}</b></div></div><div class="budgetrow"><div class="rowbetween"><span>สิทธิ์ผู้ใช้</span><b>${esc(state.user?.role||'-')}</b></div></div><div class="budgetrow"><div class="rowbetween"><span>ฐานข้อมูล</span><b>Google Sheets</b></div></div><div class="flex" style="margin-top:20px"><button class="btn dark" onclick="SM.showChangePassword()">🔑 เปลี่ยนรหัสผ่าน</button><button class="btn danger" onclick="SM.logout()">ออกจากระบบ</button></div></section></div><div class="card" style="margin-top:17px"><div class="cardhead"><h3>วิธีสำรองข้อมูล</h3></div><p class="muted">เปิด Google Sheets → ไฟล์ → ดาวน์โหลด → Microsoft Excel (.xlsx) เพื่อสำรองข้อมูลธุรกรรม และเก็บสำเนาโฟลเดอร์สลิปใน Google Drive ไว้ในพื้นที่ส่วนตัวที่ปลอดภัย รายการและไฟล์สลิปเป็นข้อมูลคนละส่วนกัน</p><p class="smallhint">ข้อจำกัด: เวอร์ชันนี้ต้องออนไลน์เมื่อบันทึก • OCR ใช้บริการ Google Cloud Vision เมื่อกำหนด API Key เท่านั้น • ไม่ได้อ่านหรือยืนยันสลิปจากธนาคารโดยตรง</p></div>`}
function investing(){return `<section class="hero"><div><span class="hero-kicker">✦ INVESTING BASICS</span><h2>เริ่มลงทุนจากแผนที่เหมาะกับเรา</h2><p>เรียนรู้ความเสี่ยง กระจายการลงทุน และตรวจสอบข้อมูลก่อนตัดสินใจ</p></div><div class="hero-side"><span>ทบทวนเนื้อหาล่าสุด</span><div class="hero-stat" style="font-size:20px">13 ต.ค. 2569</div><span>ความรู้ทั่วไป • ไม่ใช่คำแนะนำซื้อขาย</span></div></section><div class="grid twocol"><section class="card"><div class="cardhead"><div><h3>ก่อนเริ่มลงทุน</h3><small>เรียงลำดับความพร้อมทางการเงิน</small></div><span class="tag">เริ่มต้น</span></div><ol style="padding-left:21px;line-height:1.9;color:#52685d"><li>ทำงบรายรับรายจ่ายและกันเงินสำหรับค่าใช้จ่ายจำเป็น</li><li>เตรียมเงินสำรองฉุกเฉินให้เหมาะกับภาระและความมั่นคงของรายได้</li><li>จัดการหนี้ดอกเบี้ยสูงและตรวจสอบความคุ้มครองที่จำเป็น</li><li>กำหนดเป้าหมาย ระยะเวลา และจำนวนเงินที่รับความผันผวนได้</li><li>ลงทุนด้วยเงินที่ไม่จำเป็นต้องใช้ในระยะสั้น และทบทวนเป็นระยะ</li></ol></section><section class="card"><div class="cardhead"><div><h3>รู้จักความเสี่ยง</h3><small>ผลตอบแทนสูงมักมาพร้อมความผันผวนหรือโอกาสขาดทุนที่สูงขึ้น</small></div><span class="tag red">โปรดอ่าน</span></div><div class="budgetrow"><b>ความเสี่ยงตลาด</b><p class="muted">มูลค่าสินทรัพย์เปลี่ยนตามเศรษฐกิจ อัตราดอกเบี้ย และความเชื่อมั่น</p></div><div class="budgetrow"><b>ความเสี่ยงกระจุกตัว</b><p class="muted">การถือสินทรัพย์หรืออุตสาหกรรมเดียวมากเกินไปทำให้ผลกระทบหนักขึ้น</p></div><div class="budgetrow"><b>สภาพคล่องและอัตราแลกเปลี่ยน</b><p class="muted">บางสินทรัพย์ขายได้ยากหรือมูลค่าเปลี่ยนเมื่อแปลงกลับเป็นเงินบาท</p></div></section></div><section class="card" style="margin-top:17px"><div class="cardhead"><div><h3>หลักการเลือกและติดตามการลงทุน</h3><small>ใช้เป็นรายการตรวจสอบก่อนตัดสินใจ</small></div></div><div class="grid twocol"><div><h4>กระจายความเสี่ยง</h4><p class="muted">พิจารณากระจายตามประเภทสินทรัพย์ ภูมิภาค และผู้ออกหลักทรัพย์ โดยเลือกให้สอดคล้องกับเป้าหมาย การกระจายช่วยลดความเสี่ยงเฉพาะจุด แต่ไม่รับประกันกำไรหรือป้องกันการขาดทุนทั้งหมด</p><h4>เข้าใจต้นทุนและเงื่อนไข</h4><p class="muted">ตรวจสอบค่าธรรมเนียม ภาษี เงื่อนไขซื้อขาย ระยะเวลาถอนเงิน และเอกสารข้อมูลสำคัญก่อนลงทุน</p></div><div><h4>ตรวจสอบผู้ให้บริการ</h4><p class="muted">ตรวจใบอนุญาตและรายชื่อผู้ประกอบธุรกิจผ่าน ก.ล.ต. อย่าโอนเงินเข้าบัญชีบุคคลหรือเชื่อคำรับประกันผลตอบแทน</p><h4>ระวังกลโกง</h4><p class="muted">คำชวนลงทุนที่เร่งให้ตัดสินใจ รับประกันกำไร หรือชวนหาสมาชิกเพื่อรับผลตอบแทน ควรหยุดตรวจสอบกับแหล่งทางการก่อน</p></div></div></section><section class="card" style="margin-top:17px"><div class="cardhead"><div><h3>เรียนรู้ต่อจากแหล่งข้อมูลทางการ</h3><small>เปิดลิงก์เพื่อตรวจสอบรายละเอียดและประกาศล่าสุด</small></div></div><div class="grid twocol"><a class="btn ghost" href="https://www.sec.or.th/TH/Pages/Investors/Investors1.aspx" target="_blank" rel="noopener">สำนักงาน ก.ล.ต. — ความรู้ผู้ลงทุน ↗</a><a class="btn ghost" href="https://www.set.or.th/th/education-research/education/happymoney/knowledge/video/242-allocate-assets-by-yourself-familys-guide-ep-12" target="_blank" rel="noopener">ตลาดหลักทรัพย์ฯ — ห้องเรียนลงทุน ↗</a><a class="btn ghost" href="https://market.sec.or.th/public/idisc/th/investoralert" target="_blank" rel="noopener">ก.ล.ต. — Investor Alert ↗</a><a class="btn ghost" href="https://www.bot.or.th/th/satang-story.html" target="_blank" rel="noopener">ธนาคารแห่งประเทศไทย — ความรู้การเงิน ↗</a></div><div class="notice" style="margin-top:18px">เนื้อหานี้เป็นความรู้ทั่วไป ไม่ใช่คำแนะนำการลงทุนเฉพาะบุคคล ไม่รับประกันผลตอบแทนและอาจไม่ครอบคลุมประกาศล่าสุด โปรดอ่านหนังสือชี้ชวน/เอกสารข้อมูลสำคัญและพิจารณาความเสี่ยงก่อนลงทุน</div></section>`}function setReportDate(k,v){state[k]=v}
function reportRows(all=false){const from=state.fromDate||state.month+'-01',to=state.toDate||today();return confirmed().filter(t=>!all||(t.date>=from&&t.date<=to)).sort((a,b)=>a.date.localeCompare(b.date))}
function csvEscape(v){let z=String(v??'');if(/^[\s]*[=+@]/.test(z))z="'"+z;return '"'+z.replace(/"/g,'""')+'"'}
function exportCSV(useRange=false){const data=useRange?reportRows(true):confirmed().filter(t=>t.date?.slice(0,7)===state.month);const hdr=['วันที่','ประเภท','จำนวนเงิน','หมวดหมู่','บัญชีต้นทาง','บัญชีปลายทาง','วิธีชำระ','คู่ค้า/ผู้รับ','รายละเอียด','เลขอ้างอิง','สถานะ','มีสลิป'];const rows=data.map(t=>[t.date,t.type,t.amount,catName(t),acct(t.accountId)?.name||'',acct(t.toAccountId)?.name||'',t.paymentMethod,t.merchant,t.description,t.reference,t.status,t.receiptId?'ใช่':'ไม่']);const csv='\ufeff'+[hdr,...rows].map(a=>a.map(csvEscape).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='SmartMoney_'+(useRange?'Report_'+(state.fromDate||state.month+'-01')+'_'+(state.toDate||today()):state.month)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);showToast('ส่งออก CSV สำเร็จ')}
function printReport(){const tx=reportRows(true),from=state.fromDate||state.month+'-01',to=state.toDate||today(),win=window.open('','_blank');if(!win)return showToast('กรุณาอนุญาตให้เปิดหน้าต่างใหม่เพื่อพิมพ์รายงาน',true);const html=`<!doctype html><html lang="th"><head><meta charset="utf-8"><title>รายงาน Smart Money</title><style>body{font-family:Arial,'Noto Sans Thai',sans-serif;padding:27px;color:#173e2e}h1{color:#098754}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;border-bottom:1px solid #ddd;padding:9px}th{background:#e9f7ee}.right{text-align:right}@media print{body{padding:0}}</style></head><body><h1>Smart Money — รายงานรายรับ–รายจ่าย</h1><p>ช่วงวันที่ ${esc(dt(from))} ถึง ${esc(dt(to))} | พิมพ์เมื่อ ${esc(new Date().toLocaleString('th-TH'))}</p><p><b>รายรับ</b> ฿${money(txValue('income',tx))} &nbsp; <b>รายจ่าย</b> ฿${money(txValue('expense',tx))} &nbsp; <b>ชำระหนี้</b> ฿${money(txValue('debt_payment',tx))}</p><table><tr><th>วันที่</th><th>รายการ</th><th>หมวด</th><th>ประเภท</th><th class="right">จำนวน</th></tr>${tx.map(t=>`<tr><td>${esc(dt(t.date))}</td><td>${esc(t.description||t.merchant||'-')}</td><td>${esc(catName(t))}</td><td>${esc(t.type)}</td><td class="right">${money(t.amount)}</td></tr>`).join('')}</table><script>window.onload=function(){window.print()}<\/script></body></html>`;win.document.write(html);win.document.close()}
function openDebtPayment(debtId){const d=deb(debtId);if(!d)return;showModal(`<div class="modalhead"><h2>บันทึกการชำระหนี้</h2></div><p class="muted">${esc(d.name)} — แยกเงินต้นและดอกเบี้ยเพื่อคำนวณยอดคงเหลือถูกต้อง</p><form onsubmit="SM.submitDebtPayment(event)"><input type="hidden" name="debtId" value="${esc(debtId)}"/><div class="formgrid"><label class="field">วันที่ชำระ<input type="date" name="date" value="${today()}" required/></label><label class="field">บัญชีที่ใช้จ่าย<select name="accountId" required>${optAccounts()}</select></label><label class="field">เงินต้นที่ชำระ<input type="number" name="principalPaid" step="0.01" min="0" value="0" required/></label><label class="field">ดอกเบี้ยที่ชำระ<input type="number" name="interestPaid" step="0.01" min="0" value="0" required/></label><label class="field wide">หมายเหตุ<input name="notes"/></label></div><div class="formactions"><button type="button" class="btn ghost" onclick="SM.closeModal()">ยกเลิก</button><button class="btn primary" type="submit">บันทึกชำระหนี้</button></div></form>`)}
async function submitDebtPayment(ev){ev.preventDefault();const data=Object.fromEntries(new FormData(ev.target));try{await act('addDebtPayment',data);closeModal()}catch(e){}}
const editorConfig={account:['Accounts','saveAccount','บัญชีเงิน'],category:['Categories','saveCategory','หมวดหมู่'],budget:['Budgets','saveBudget','งบประมาณ'],goal:['goals','saveGoal','เป้าหมายการออม'],debt:['debts','saveDebt','รายการหนี้'],user:['users','addUser','ผู้ใช้งาน']};
function openEditor(type,rowId){if(!isEdit())return;const conf=editorConfig[type],list=arr(conf[0]==='Accounts'?'accounts':conf[0]==='Categories'?'categories':conf[0]==='Budgets'?'budgets':conf[0]),v=list.find(x=>x.id===rowId)||{},opt=(pairs,current)=>pairs.map(([key,label])=>`<option value="${key}" ${current===key?'selected':''}>${label}</option>`).join('');let body='';
 const f=(label,name,value='',type='text',extra='')=>`<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}/></label>`;
 if(type==='account')body=f('ชื่อบัญชี','name',v.name,'text','required')+`<label class="field">ประเภทบัญชี<select name="type">${opt([['cash','เงินสด'],['bank','ธนาคาร'],['savings','เงินออม'],['credit','บัตรเครดิต'],['other','อื่น ๆ']],v.type||'bank')}</select></label>`+f('ยอดยกมา (บาท)','openingBalance',v.openingBalance||0,'number','step="0.01" required')+`<label class="field">สถานะ<select name="active"><option value="true">ใช้งาน</option><option value="false" ${String(v.active)==='false'?'selected':''}>ปิดใช้งาน</option></select></label>`;
 if(type==='category')body=f('ชื่อหมวดหมู่','name',v.name,'text','required')+`<label class="field">ประเภท<select name="type">${opt([['expense','รายจ่าย'],['income','รายรับ']],v.type||'expense')}</select></label>`+f('สีประจำหมวด','color',v.color||'#0ba65c','color')+`<label class="field">สถานะ<select name="active"><option value="true">ใช้งาน</option><option value="false" ${String(v.active)==='false'?'selected':''}>ปิดใช้งาน</option></select></label>`;
 if(type==='budget')body=f('เดือน','month',v.month||state.month,'month','required')+`<label class="field">หมวดรายจ่าย<select name="categoryId" required><option value="">เลือกหมวด</option>${optCats('expense',v.categoryId)}</select></label>`+f('งบประมาณ (บาท)','limitAmount',v.limitAmount||'','number','min="0.01" step="0.01" required');
 if(type==='goal')body=f('ชื่อเป้าหมาย','name',v.name,'text','required')+f('ยอดเป้าหมาย','targetAmount',v.targetAmount||'','number','step="0.01" min="0.01" required')+f('ยอดสะสมปัจจุบัน','currentAmount',v.currentAmount||0,'number','step="0.01" min="0" required')+f('กำหนดวันที่','targetDate',v.targetDate||today(),'date')+`<input type="hidden" name="active" value="true"/>`;
 if(type==='debt')body=f('ชื่อหนี้ / เจ้าหนี้','name',v.name,'text','required')+f('เงินต้นเริ่มต้น','principal',v.principal||'','number','step="0.01" min="0.01" required')+f('ดอกเบี้ยต่อปี (%)','interestRate',v.interestRate||0,'number','step="0.01" min="0"')+f('จำนวนผ่อนต่อเดือน','monthlyPayment',v.monthlyPayment||0,'number','step="0.01" min="0"')+f('ครบกำหนดวันที่ของเดือน','dueDay',v.dueDay||1,'number','min="1" max="31"')+`<input type="hidden" name="active" value="true"/>`;
 if(type==='user')body=f('ชื่อสำหรับแสดง','displayName','','text','required')+f('ชื่อเข้าใช้ (ภาษาอังกฤษ)','username','','text','required')+f('รหัสผ่านเริ่มต้น (ขั้นต่ำ 10 ตัว)','password','','password','minlength="10" required')+`<label class="field">สิทธิ์<select name="role">${opt([['viewer','ดูข้อมูล'],['editor','ดูและบันทึก'],['admin','ผู้ดูแลระบบ']],'editor')}</select></label>`;
 showModal(`<div class="modalhead"><div><div class="logopill">SMART MONEY</div><h2>${rowId?'แก้ไข':'เพิ่ม'}${conf[2]}</h2></div></div><form onsubmit="SM.submitEditor(event,'${type}')"><input type="hidden" name="id" value="${esc(v.id||'')}"/><div class="formgrid">${body}</div><div class="formactions"><button type="button" class="btn ghost" onclick="SM.closeModal()">ยกเลิก</button><button type="submit" class="btn primary">บันทึกข้อมูล</button></div></form>`)}
async function submitEditor(ev,type){ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));delete d.id;if(ev.target.elements.id?.value)d.id=ev.target.elements.id.value;if(['account','category','goal','debt'].includes(type))d.active=d.active!=='false';try{await act(editorConfig[type][1],d);closeModal()}catch(e){}}
window.SM={login,logout,refresh,navigate,setMonth,setFilterType,setSearch,changeTxType,chooseReceipt,scanSlip,saveTx,editTx,cancelTx,viewReceipt,openEditor,submitEditor,openDebtPayment,submitDebtPayment,toggleUser,exportCSV,printReport,setReportDate,showChangePassword,submitPassword,closeModal};
// Public investing education page is available without signing in; private data still requires authentication.
state.page='dashboard';render();if(state.token){setBusy(true);loadData().catch(e=>{state.token='';sessionStorage.removeItem('sm_token');state.user=null;state.data=null;render();showLogin();showToast('กรุณาเข้าสู่ระบบอีกครั้ง: '+e.message,true)}).finally(()=>setBusy(false))}
})();
